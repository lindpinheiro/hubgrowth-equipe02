*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#04070e;color:#f5fafc;
  font-family:"Lexend",ui-sans-serif,system-ui,sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;z-index:0}
.neb{position:fixed;inset:0;z-index:1;pointer-events:none;background:
  radial-gradient(70% 55% at 50% -10%,rgba(112,47,166,.55),transparent 70%),
  radial-gradient(45% 40% at 8% 92%,rgba(120,18,119,.4),transparent 72%),
  radial-gradient(50% 45% at 96% 88%,rgba(14,30,201,.34),transparent 72%)}
.wrap{position:relative;z-index:2;height:100%;display:grid;place-items:center;padding:24px}
.panel{width:min(430px,100%);background:linear-gradient(168deg,rgba(16,27,56,.9),rgba(10,19,40,.62));
  border:1px solid rgba(12,204,204,.32);border-radius:14px;padding:34px 30px;
  box-shadow:0 0 60px rgba(12,204,204,.12),0 24px 70px rgba(0,0,0,.6)}
.eyebrow{font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;color:#0ccccc;margin-bottom:14px}
h1{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0 0 8px}
p.sub{font-size:14px;line-height:1.5;color:#8ea6c6;margin:0 0 22px}
label{display:block;font-family:ui-monospace,Consolas,monospace;font-size:10.5px;
  letter-spacing:.18em;text-transform:uppercase;color:#5b719a;margin-bottom:8px}
.row{display:flex;gap:9px}
input{flex:1;min-width:0;background:rgba(4,7,14,.72);border:1px solid rgba(143,166,198,.3);
  color:#f5fafc;border-radius:8px;padding:12px 14px;font-size:15px;font-family:inherit}
input:focus{outline:2px solid #0ccccc;outline-offset:1px;border-color:#0ccccc}
button{background:#0ccccc;color:#04070e;border:0;border-radius:8px;padding:12px 20px;
  font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
button:hover{background:#3ae0e0}
button:disabled{opacity:.6;cursor:progress}

function b64(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function unlock(pw,payload){
  var enc=new TextEncoder();
  var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  var key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64(payload.salt),iterations:310000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  var plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},key,b64(payload.data));
  return new TextDecoder().decode(plain);
}
